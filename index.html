<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Solvalou: Sector 7</title>
  <style>
    :html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;font-family:"Trebuchet MS",Arial,sans-serif;touch-action:none}
    body{color:#fff}
    canvas{display:block;width:100vw;height:100vh}
    #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 8px #000}
    .top{position:absolute;top:18px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:flex-start}
    .label{font-size:11px;letter-spacing:3px;color:#74a7b4}.value{font-size:22px;font-weight:900;font-style:italic}.life{display:flex;gap:7px;margin-top:6px}.life i{width:22px;height:9px;display:block;clip-path:polygon(50% 0,100% 100%,62% 100%,50% 75%,38% 100%,0 100%);background:#e8ffed;box-shadow:0 0 12px #78ffc2}
    #stage{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center}.bar{width:190px;height:4px;background:#18313a;margin:8px auto;overflow:hidden}.bar b{display:block;height:100%;width:100%;background:linear-gradient(90deg,#77e8ff,#efffd2);transition:width .2s}
    #warning{position:absolute;left:50%;bottom:23%;transform:translateX(-50%);font-size:20px;font-weight:900;letter-spacing:5px;color:#ff7b82;opacity:0;transition:.2s}
    #warning.show{opacity:1}
    #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(6,19,30,.25),rgba(0,2,8,.78));text-align:center;transition:.25s}
    #overlay.hidden{opacity:0;pointer-events:none}.card{max-width:620px;padding:28px}.eyebrow{color:#87d2e0;font-size:12px;letter-spacing:7px;font-weight:bold}.title{font-size:clamp(54px,9vw,100px);line-height:.78;margin:18px 0 22px;font-weight:950;font-style:italic;letter-spacing:-5px;text-transform:uppercase;text-shadow:5px 7px 0 #102c38,0 0 30px #34879a}.title span{color:#9df1dd}.subtitle{color:#a9bec3;font-size:13px;letter-spacing:2px;line-height:1.8}.button{pointer-events:auto;border:1px solid #82b7c4;background:rgba(13,45,54,.72);color:#dffff7;padding:14px 28px;margin-top:22px;font-weight:900;letter-spacing:3px;cursor:pointer;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
    .controls{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}.control{pointer-events:auto;width:68px;height:68px;border:1px solid rgba(160,221,221,.22);border-radius:50%;background:rgba(20,62,70,.18);display:flex;align-items:center;justify-content:center;color:rgba(220,255,248,.65);font-size:24px;user-select:none}.fire{margin-left:auto;background:rgba(88,180,171,.12);border-color:rgba(180,255,224,.38)}
    @media (pointer:fine){.controls{display:none}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="top"><div><div class="label">SCORE</div><div class="value" id="score">000000</div><div class="life" id="life"></div></div><div id="stage"><div class="label">SECTOR 7 / EXTRACTION</div><div class="bar"><b id="progress"></b></div></div><div style="text-align:right"><div class="label">WEAPON</div><div class="value" style="color:#9ef2dc">VULCAN</div></div></div>
    <div id="warning">WARNING // HOSTILES</div>
  </div>
  <div id="overlay"><div class="card"><div class="eyebrow">XEVIOUS FRONTIER UNIT</div><div class="title">SOLV<span>ALOU</span></div><div class="subtitle">DESTROY THE CORE // CLEAR THE SECTOR<br>ARROWS / WASD TO MOVE • Z / SPACE TO FIRE</div><button class="button" id="start">LAUNCH</button></div></div>
  <div class="controls"><div class="control" id="left">◀</div><div class="control" id="right">▶</div><div class="control fire" id="fire">FIRE</div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},touch={};addEventListener('keydown',e=>{keys[e.key.toLower]=1;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key==='Enter'&&!running)start()});addEventListener('keyup',e=>keys[e.key.toLower]=0);
function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventPreventDefault?.();touch[key]=1});el.addEventListener('pointerup',()=>touch[key]=0);el.addEventListener('pointercancel',()=>touch[key]=0)}bind('left','left');bind('right','right');bind('fire','fire');
let running=false,score=0,lives=3,player,bullets=[],enemies=[],enemyShots=[],particles=[],distance=0,time=0,shake=0,gameOver=false,spawn=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function start(){running=true;gameOver=false;score=0;lives=3;distance=0;bullets=[];enemies=[];enemyShots=[];particles=[];spawn=0;player={x:0,y:H*.72,vx:0,vy:0,inv:2,tilt:0};document.getElementById('overlay').classList.add('hidden');updateHUD()}document.getElementById('start').onclick=start;
function updateHUD(){document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('life').innerHTML='<i></i>'.repeat(Math.max(0,lives));document.getElementById('progress').style.width=(100-(distance%4200)/42)+'%'}
function burst(x,y,c,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rnd(30,180);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.8),c})}}
function fire(){bullets.push({x:player.x,y:player.y-20,vx:-.2,vy:-720})}
function spawnEnemy(){let side=Math.random()<.5?-1:1,x=rnd(W*.12,W*.88),type=Math.random()<.18?'diamond':'zako';enemies.push({x,y:-40,vx:rnd(-25,25)+(side*15),vy:rnd(55,105),type,hp:type==='diamond'?3:1,t:rnd(0,6),size:type==='diamond'?22:16})}
function collide(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}
function loop(now){requestAnimationFrame(loop);if(!running){draw(now/1000);return}let dt=Math.min(.033,(now-(loop.last||now))/1000);loop.last=now;time+=dt;distance+=dt*180;
let left=keys.a||keys.arrowleft||touch.left,right=keys.d||keys.arrowright||touch.right,up=keys.w||keys.arrowup,down=keys.s||keys.arrowdown;player.vx+=(right-left)*1000*dt-player.vx*8*dt;player.vy+=(down-up)*700*dt-player.vy*8*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=Math.max(28,Math.min(W-28,player.x));player.y=Math.max(H*.25,Math.min(H*.86,player.y));player.tilt+=(player.vx*.0015-player.tilt)*.12;if(player.inv>0)player.inv-=dt;
if(keys.z||keys[' ']||touch.fire)if(!player.fire||time-player.fire>.12){fire();player.fire=time}spawn-=dt;if(spawn<0){spawn=rnd(.32,.75);spawnEnemy()}
for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}bullets=bullets.filter(b=>b.y>-30);
for(let e of enemies){e.t+=dt;e.x+=e.vx*dt+Math.sin(e.t*2)*18*dt;e.y+=e.vy*dt;if(e.type==='diamond'&&Math.random()<.012)enemyShots.push({x:e.x,y:e.y,vx:(player.x-e.x)*.22,vy:150});if(e.y>H*.62&&Math.random()<.018)enemyShots.push({x:e.x,y:e.y,vx:rnd(-35,35),vy:rnd(150,220)})}enemies=enemies.filter(e=>e.y<H+50);
for(let s of enemyShots){s.x+=s.vx*dt;s.y+=s.vy*dt}
enemyShots=enemyShots.filter(s=>s.y<H+30&&s.x>-30&&s.x<W+30);
for(let b of bullets)for(let e of enemies){if(!e.dead&&collide(b,e,e.size)){b.dead=true;e.hp--;burst(b.x,b.y,'#91fff0',5);if(e.hp<=0){e.dead=true;score+=e.type==='diamond'?300:100;burst(e.x,e.y,e.type==='diamond'?'#ff8b9a':'#ffe38c',18)}}}bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead);
if(player.inv<=0){for(let s of enemyShots)if(collide(player,s,14)){s.dead=true;damage()}for(let e of enemies)if(collide(player,e,20)){e.dead=true;damage()}}enemyShots=enemyShots.filter(s=>!s.dead);enemies=enemies.filter(e=>!e.dead);
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt}particles=particles.filter(p=>p.life>0);updateHUD();if(distance>4200){distance=0;score+=1000;document.getElementById('warning').textContent='SECTOR CLEAR // CONTINUE';document.getElementById('warning').classList.add('show');setTimeout(()=>document.getElementById('warning').classList.remove('show'),1300)}draw(time)}
function damage(){lives--;shake=.35;burst(player.x,player.y,'#fff1ba',30);player.inv=2;if(lives<=0){running=false;gameOver=true;document.querySelector('.title').innerHTML='GAME <span>OVER</span>';document.querySelector('.subtitle').innerHTML='FINAL SCORE // '+String(score).padStart(6,'0')+'<br>PRESS LAUNCH TO REDEPLOY';document.getElementById('start').textContent='REDEPLOY';document.getElementById('overlay').classList.remove('hidden')}}
function draw(t){ctx.save();if(shake>0){shake-=.016;ctx.translate(rnd(-5,5),rnd(-5,5))}drawWorld(t);drawPlayer();for(let e of enemies)drawEnemy(e);for(let b of bullets)drawShot(b);for(let s of enemyShots)drawEnemyShot(s);for(let p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;ctx.restore()}
function drawWorld(t){ctx.fillStyle='#02050b';ctx.fillRect(0,0,W,H);let horizon=H*.18;let grd=ctx.createLinearGradient(0,horizon,0,H);grd.addColorStop(0,'#071016');grd.addColorStop(.35,'#0a1d24');grd.addColorStop(1,'#02040b');ctx.fillStyle=grd;ctx.fillRect(0,horizon,W,H-horizon);
// receding radial canyon
ctx.save();ctx.translate(W/2,horizon);let offset=(t*260)%52;for(let i=0;i<18;i++){let z=(i*52-offset+1040)%1040/1040,y=horizon+(1-z)*(H-horizon)*.95;let spread=80+(1-z)*W*.42;ctx.strokeStyle=`rgba(83,140,143,${.12+z*.24})`;ctx.lineWidth=1+z*2;ctx.beginPath();ctx.moveTo(-spread,y);ctx.lineTo(-spread*.62,H);ctx.moveTo(spread,y);ctx.lineTo(spread*.62,H);ctx.stroke()}ctx.restore();
// star dust
ctx.fillStyle='rgba(170,220,210,.35)';for(let i=0;i<34;i++){let x=(i*197%W),y=(i*83+distance*1.3)%H;ctx.fillRect(x,y,1,1)}
// grid and surface highlights
ctx.strokeStyle='rgba(83,187,183,.13)';ctx.lineWidth=1;let van=W/2,hh=horizon;for(let x=-W;x<W*2;x+=70){ctx.beginPath();ctx.moveTo(van,hh);ctx.lineTo(x,H);ctx.stroke()}for(let i=0;i<12;i++){let z=((i/12+distance*.00055)%1);let y=hh+(z*z)*(H-hh);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()} }
function drawPlayer(){if(!player||player.inv>0&&Math.floor(player.inv*10)%2)return;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.tilt);ctx.shadowBlur=18;ctx.shadowColor='#58dfc2';ctx.fillStyle='#dffaf3';ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(11,-5);ctx.lineTo(28,14);ctx.lineTo(10,10);ctx.lineTo(0,22);ctx.lineTo(-10,10);ctx.lineTo(-28,14);ctx.lineTo(-11,-5);ctx.closePath();ctx.fill();ctx.fillStyle='#5d9aaa';ctx.beginPath();ctx.moveTo(-5,-13);ctx.lineTo(0,-23);ctx.lineTo(5,-13);ctx.lineTo(3,5);ctx.lineTo(-3,5);ctx.closePath();ctx.fill();ctx.fillStyle='#70ffd7';ctx.fillRect(-3,18,6,10+Math.random()*8);ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.t*.8);ctx.shadowBlur=12;ctx.shadowColor=e.type==='diamond'?'#ff667f':'#ffc45c';ctx.fillStyle=e.type==='diamond'?'#d94e72':'#f1b94e';ctx.strokeStyle='#fff2bd';ctx.lineWidth=1.5;if(e.type==='diamond'){ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(15,0);ctx.lineTo(0,20);ctx.lineTo(-15,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#542a48';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill()}else{ctx.beginPath();ctx.moveTo(-17,-8);ctx.lineTo(-5,-13);ctx.lineTo(0,-20);ctx.lineTo(5,-13);ctx.lineTo(17,-8);ctx.lineTo(10,13);ctx.lineTo(0,8);ctx.lineTo(-10,13);ctx.closePath();ctx.fill();ctx.stroke()}ctx.restore()}
function drawShot(b){ctx.save();ctx.shadowBlur=15;ctx.shadowColor='#9ffff4';ctx.fillStyle='#baffef';ctx.fillRect(b.x-2,b.y-10,4,19);ctx.restore()}function drawEnemyShot(s){ctx.save();ctx.translate(s.x,s.y);ctx.shadowBlur=10;ctx.shadowColor='#ff5878';ctx.fillStyle='#ff8293';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();ctx.restore()}requestAnimationFrame(loop);
</script>
</body>
</html>
